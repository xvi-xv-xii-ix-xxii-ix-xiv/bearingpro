[package]
name = "bearingpro"
version = "0.12.0"
authors = ["xvi.xv.xii.ix.xxii.ix.xiv <xvi.xv.xii.ix.xxii.ix.xiv@gmail.com>"]
edition = "2021"
rust-version = "1.81"
description = "A Rust library for solving common maritime navigation tasks."
repository = "https://github.com/xvi-xv-xii-ix-xxii-ix-xiv/bearingpro"
license = "MIT"
homepage = "https://github.com/xvi-xv-xii-ix-xxii-ix-xiv/bearingpro"
documentation = "https://docs.rs/bearingpro"
readme = "README.md"
keywords = ["bearing", "course", "compass", "deviation", "navigation"]
categories = ["science", "no-std", "algorithms"]
exclude = [".github/", "deny.toml", "SECURITY.md"]

[features]
default = ["std"]
# Use the standard library's floating point maths.
std = []
# Use the pure-Rust `libm` instead, for `no_std` targets.
libm = ["dep:libm"]
# Serialise and deserialise the value types. Deserialisation goes through the
# same validation as construction, so a stored value cannot smuggle in a
# latitude of 500 degrees.
serde = ["dep:serde"]

[dependencies]
libm = { version = "0.2", optional = true, default-features = false }
serde = { version = "1", optional = true, default-features = false, features = [
    "alloc",
    "derive",
] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A navigation library must not abort the process on bad data.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
# The numeric kernels are written in the notation of the formulas they implement.
similar_names = "allow"
module_name_repetitions = "allow"
